<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title.setup">soundtube — première installation</title>
  <meta name="theme-color" content="#0b1022">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=1.20.0">
  <link rel="stylesheet" href="/css/auth.css?v=1.20.0">
</head>
<body class="auth-body">
  <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>
  <main class="auth-card">
    <a class="brand auth-brand" href="/accueil"><span>sound<em>tube</em></span></a>
    <div class="auth-lang" id="langHost"></div>
    <h1 data-i18n="setup.title">Créer le compte admin</h1>
    <p class="hint" data-i18n="setup.lead">Première installation — accessible uniquement depuis le réseau local.</p>
    <form id="setupForm" class="auth-form" autocomplete="on">
      <div class="field"><label for="user" data-i18n="login.user">Nom d’utilisateur</label><input id="user" required minlength="3" maxlength="32" autocomplete="username" spellcheck="false"></div>
      <div class="field"><label for="pass" data-i18n="login.pass">Mot de passe</label><input id="pass" type="password" required minlength="10" autocomplete="new-password"></div>
      <div class="field"><label for="pass2" data-i18n="setup.pass2">Confirmer</label><input id="pass2" type="password" required minlength="10" autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit" data-i18n="setup.submit">Créer l’admin</button>
      <p class="hint err" id="msg" role="alert" hidden></p>
    </form>
  </main>
  <script type="module" src="/js/setup.js?v=1.20.0"></script>
</body>
</html>
