# Nginx Proxy Manager — Custom Location (Advanced) pour bloquer /admin depuis internet.
# À coller dans l’hôte Proxy Host du domaine public, onglet « Custom locations » :
#   Location : /admin
#   Scheme   : http
#   Forward  : 127.0.0.1 (ignoré — on répond 404 ici)
# Ou dans « Advanced » du Proxy Host :

location ^~ /admin {
    return 404;
}
location ^~ /admin.html {
    return 404;
}
location ^~ /api/admin {
    return 404;
}
location ^~ /setup {
    return 404;
}

# En-têtes supplémentaires côté NPM (si tu ne les mets pas uniquement dans soundtube) :
